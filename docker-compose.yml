version: '3.8'

services:
  # Redis for job queue (BullMQ)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Background worker for processing conversion jobs
  worker:
    build: .
    command: node dist/pipeline/worker.js
    environment:
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./tmp:/app/tmp
      - ./output:/app/output
    restart: unless-stopped

  # Main application server
  app:
    build: .
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NODE_ENV=development
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  redis_data:
